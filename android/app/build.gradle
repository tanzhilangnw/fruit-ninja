plugins { id 'com.android.application' }
android {
 namespace 'com.fruitdojo.game'
 compileSdk 35
 defaultConfig { applicationId 'com.fruitdojo.game'; minSdk 23; targetSdk 35; versionCode 3; versionName '1.2' }
}
tasks.register('copyGame', Copy) {
 from('../..') { include '*.html', '*.js', '*.css', '*.png' }
 into 'src/main/assets'
}
preBuild.dependsOn copyGame
