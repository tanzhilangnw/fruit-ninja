<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水果道场 · 划出你的连击</title><meta name="description" content="滑动刀锋，切开水果，避开炸弹。在经典和限时模式中挑战你的最高分。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%233d8236'/%3E%3Cpath d='M8 34h48a24 24 0 0 1-48 0' fill='%23ef4b45' stroke='%23c8ed9b' stroke-width='4'/%3E%3Cpath d='m23 42 2 4m11-4 2 4' stroke='%2325140d' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="dojo">
  <canvas id="game" aria-label="水果划切游戏区域"></canvas>
  <header class="hud">
    <div class="scorebox"><span class="eyebrow">本局得分</span><strong id="score">0</strong><span class="best">最高 <b id="best">0</b></span></div>
    <div class="hud-right"><div id="status" class="status">水果道场</div><button id="sound" class="icon-button" aria-label="关闭声音" title="声音">♫</button><button id="pause" class="icon-button" aria-label="暂停游戏" title="暂停" hidden>Ⅱ</button></div>
  </header>
  <div id="centerMessage" aria-live="polite"></div>
  <section id="menu" class="menu">
    <div class="seal">斩</div><p class="kicker">FRUIT DOJO</p><h1>水果<span>道场</span></h1>
    <p class="intro">刀锋所至，果汁四溅。</p>
    <div class="hero-fruit" aria-hidden="true"><i class="fruit apple"></i><i class="fruit melon"></i><i class="fruit orange"></i><span class="slash"></span></div>
    <div class="modes"><button id="classic" class="mode classic"><span class="mode-title">经典模式</span><span class="mode-copy">三次漏切机会 · 避开炸弹</span><span class="mode-tag">开始修炼</span></button><button id="arcade" class="mode arcade"><span class="mode-title">限时模式</span><span class="mode-copy">60 秒冲分 · 炸弹扣 10 分</span><span class="mode-tag">挑战极限</span></button></div>
    <p class="instruction"><span class="instruction-line"></span>按住鼠标划切 · 手机用手指滑动<span class="instruction-line"></span></p>
  </section>
  <section id="overlay" class="overlay" hidden><div class="result"><p id="resultLabel" class="kicker">修炼结束</p><h2 id="resultTitle">再来一刀</h2><div id="resultScore" class="result-score">0</div><p id="resultDetail">最高分 0</p><div class="result-actions"><button id="again" class="primary">再来一局</button><button id="home" class="secondary">回到道场</button></div></div></section>
  <footer><span>一刀切中 3 个以上水果，获得连击奖励</span><span id="footerMode">经典划切 · 原创画作</span></footer>
</main>
<script src="game.js"></script>
</body>
</html>
